<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HistroSoft</title>
    <meta name="description" content="Consultoría de software para empresas: páginas web, CRM, ERP, aplicaciones móviles y automatizaciones a la medida y productos empaquetados." />
    <meta property="og:title" content="HistroSoft — Consultoría de software y productos empaquetados" />
    <meta property="og:description" content="Consultoría de software para empresas: páginas web, CRM, ERP, aplicaciones móviles y automatizaciones a la medida y productos empaquetados." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="theme-color" content="#1747C9" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased">
    <div id="root">
      <!-- Esqueleto inicial: se ve mientras se descarga la app y React lo reemplaza al montar -->
      <div aria-hidden="true" style="min-height:100vh;background:var(--surface-sunken)">
        <div style="height:80px;background:var(--surface-page);border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,calc((100vw - 1200px) / 2 + 32px))">
          <div class="skeleton" style="width:141px;height:32px"></div>
          <div class="skeleton" style="width:150px;height:36px;border-radius:999px"></div>
        </div>
        <div style="background:var(--azul-noche);padding:96px max(16px,calc((100vw - 1200px) / 2 + 32px)) 120px">
          <div style="height:28px;width:260px;border-radius:999px;background:rgba(255,255,255,.08);margin-bottom:28px"></div>
          <div style="height:48px;width:min(640px,90%);border-radius:8px;background:rgba(255,255,255,.1);margin-bottom:16px"></div>
          <div style="height:48px;width:min(520px,75%);border-radius:8px;background:rgba(255,255,255,.1);margin-bottom:16px"></div>
          <div style="height:48px;width:min(400px,55%);border-radius:8px;background:rgba(255,255,255,.1)"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
